---
name: Release Drafter

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - mc

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    name: ✏️ Draft release
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find next version
        id: version
        run: |
          set -eo pipefail
          declare -i newpost
          datepre=$(date --utc '+%Y.%m')

          # No tags: first release is YYYY.MM.0 (same CalVer scheme as mc_bd).
          latest=""
          tag_sha=$(git rev-list --tags --max-count=1 2>/dev/null || true)
          if [[ -n "$tag_sha" ]]; then
            latest=$(git describe --tags --abbrev=0 "$tag_sha" 2>/dev/null) || latest=""
          fi

          if [[ -n "$latest" ]]; then
            latest_normalized="${latest#v}"
            latestpre=$(echo "$latest_normalized" | awk '{split($0,a,"."); print a[1] "." a[2]}')
          else
            latest_normalized=""
            latestpre=""
          fi

          if [[ -n "$latestpre" && "$latestpre" == "$datepre" ]]; then
            latestpost=$(echo "$latest_normalized" | awk '{split($0,a,"."); print a[3]}')
            if [[ -z "${latestpost}" ]] || ! [[ "${latestpost}" =~ ^[0-9]+$ ]]; then
              latestpost=0
            fi
            newpost=$((latestpost + 1))
          else
            newpost=0
          fi

          version_tag="${datepre}.${newpost}"
          echo "Current version: ${latest:-<no tags>}"
          echo "New target version: ${version_tag}"
          echo "version=${version_tag}" >> "$GITHUB_OUTPUT"
          echo "semver=${version_tag}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Run Release Drafter
        uses: release-drafter/release-drafter@v7.3.1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.semver }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
