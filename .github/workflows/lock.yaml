---
name: Lock

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    name: 🔒 Lock closed issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: muthur-command/actions/helpers/lock-issues@mc
        with:
          issue-inactive-days: "30"
          pr-inactive-days: "1"
